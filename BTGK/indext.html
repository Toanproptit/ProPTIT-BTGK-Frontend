<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="indext.css">
    <script src="https://kit.fontawesome.com/54aabe4c43.js" crossorigin="anonymous"></script>
</head>
<body>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="indext.js"></script>

<!-- Hiển thị animation -->
    

    <div class="app">
        <aside class ="sidebar">
            <div style="padding-top: 20px; padding-bottom: 30px;">
                <i class="fa-solid fa-bolt-lightning fa-2xl" style="color: #6c31c4;"></i>
                <p style="color: antiquewhite;">Trọng Toàn</p>
            </div>
            <div class="menu-item" >
                <i class="fa-solid fa-house fa-2xl" style="color: #FFD43B;"></i>
                <i class="fa-solid fa-location-dot fa-2xl" style="color: #FFD43B;"></i>
                <i class="fa-solid fa-globe fa-2xl" style="color: #FFD43B;"></i>
                <i class="fa-solid fa-suitcase fa-2xl" style="color: #FFD43B;"></i>
                <i class="fa-solid fa-gear fa-2xl" style="color: #FFD43B;"></i>
            </div>
            <div>
                <i class="fa-solid fa-arrow-right-from-bracket fa-fade fa-2xl" style="color: #e2e6ee;"></i>
            </div>
        </aside>

        <div class="main-contend">
            <header class="topbar">
                <div style="position: relative; display: inline-block;">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" name="searchInput" id="search" placeholder="Search...">
                </div>
                <div class="dropdown">
                    <div class="user-toggle" onclick="toggleMenu()" style="position: relative;display: inline-block;">
                        <i class="fa-solid fa-circle-user fa-2xl" style="color: #6c31c4;"></i>
                        <span>User Name</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu">
                            <a href="#">Profile</a>
                            <a href="#">Settings</a>
                            <a href="#">Logout</a>
                    </div>
                </div>

            </header>
            <main class="content">
                <div class="content-header">
                    <div class="content-header-cot1">
                        <button id="location-btn" class="location-btn">
                            <i class="fa-solid fa-location-dot fa-xl" style="color: #ededed;"></i>
                            <span id="country"></span>
                        </button>
                        <!-- <h2 id="day"></h2> -->
                        <div>
                            <h1 style="font-weight: 100; margin-bottom: 4px; font-size: 38px; "><span id="day" ></span></h1>
                            <span id="date" style=" display: block; font-size: 16px;;"></span>
                        </div>
                        
                        <div>
                            <h1 style="font-weight: 100; margin-bottom: 4px; font-size: 38px;"><span id="temp"></span></h1>
                            <span id="temp_max+min" style="display: block;font-size: 14px;"></span>
                        </div>
                            
                    </div>
                    <div class="content-header-cot2">
                        <i class="fa-regular fa-cloud fa-2xl"></i>
                    </div>
                    <div class="content-header-cot3">
                        <i class="fa-regular fa-cloud fa-xl"></i>
                        <i class="fa-regular fa-cloud fa-xl"></i>
                    </div>
                    <div class="content-header-cot4">
                        <div style="background-color: white; border-radius: 20px; width: 60px; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 3px; text-align: right;">
                            <span style="width: 24px; height: 24px; background-color: black; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">F</span>
                            <span style="width: 24px; height: 24px; color: black; display: flex; align-items: center; justify-content: center; font-weight: bold;">C</span>
                        </div>
                        <div id="weather-info">
                            <img id="weather-icon" src="" alt="Weather Icon">
                            <span id="weather-desc"></span>
                        </div>
                        <div>
                            <h1 style="font-weight: 100; margin-bottom: 4px; font-size: 30px;"><span id="main"></span></h1>
                            <span id="feels_main"></span>
                        </div>
                    </div>
                </div>
                <div class="Today-Highlight">
                    
                        <p>Today Highlight</p>
                        <div class="Today-Highlight-content">       
                            <div>
                                Chane of Rain
                                <lottie-player 
                                    src="./AnimationJSON/Graph Baby Blue.json"  
                                    background="transparent"  
                                    speed="1"  
                                    style="width: 90%; height: 90%;"  
                                    loop  
                                    autoplay>
                                </lottie-player>
                            </div>
                            <div>UV index</div>
                            <div>Wind Status</div>
                            <div>Humidity</div>
                        </div>
                   
                </div>
                <div class="weather-forecast">
                    <div class="item1">
                        <div class="iteam1_1">Today/Week</div>
                        <div class="item1_2">
                            <div class="day">
                                <p style="text-align: center;">1PM</p>
                                <img id="weather-icon1" src="" alt="">
                                <p style="text-align: center;">32°C</p>
                            </div>  
                            <div class="day">
                                <p style="text-align: center;">2PM</p>
                                <img id="weather-icon2" src="" alt="">  
                                <p style="text-align: center;">33°C</p>
                            </div>
                            <div class="day">
                                <p style="text-align: center;">3PM</p>
                                <img id="weather-icon3" src="" alt="">  
                                <p style="text-align: center;">37°C</p> 
                            </div>
                            <div class="day">
                                <p style="text-align: center;">4PM</p>
                                <img id="weather-icon4" src="" alt="">  
                                <p style="text-align: center;">37°C</p> 
                            </div>
                            <div class="day">
                                <p style="text-align: center;">5PM</p>
                                <img id="weather-icon5" src="" alt="">  
                                <p style="text-align: center;">32°C</p> 
                            </div>
                            <div class="day">
                                <p style="text-align: center;">6PM</p>
                                <img id="weather-icon6" src="" alt="">  
                                <p style="text-align: center;">25°C</p> 
                            </div>
                            <div class="day">
                                <p style="text-align: center;">7PM</p>
                                <img id="weather-icon7" src="" alt="">  
                                <p style="text-align: center;">24°C</p> 
                            </div>
                        </div>
                    </div>
                    
                    <div class="item2">
                        <p style="color: #24262e;">SunRise</p>
                        <div class="sunRise">
                            <span style="font-size: 20px;" id="sunrise"></span>
                        </div>
                        <p style="color: #24262e;">SunSet</p>
                        <div class="sunSet">
                            <span style="font-size: 20px;" id="sunset"></span>
                        </div>
                        <p style="color: #24262e;">lengthf the day</p>
                        <div class="lengthftheday">
                            <span style="font-size: 20px;" id="lengthftheday"></span>
                        </div>
                    </div>
                        <div class="item3">
                            <div class="iteam3_1">
                                <p>Tomorrow</p>
                                <span id="feels_main1"></span>
                            </div>
                            <div class="iteam3_2">
                                <h2><p>24°C</p></h2>
                            </div>
                            <div class = "iteam3_3">
                                <i class="fa-solid fa-cloud-bolt fa-fade fa-2xl"  style="font-size: 70px; color: #74C0FC;"></i>
                            </div>
                        </div> 
                </div>
                <div class="other-cites">
                    <div class="other-cites1">
                        <div style="font-size: 20px; ;">Other Cities</div>
                        <label style="border-radius: 10px; background-color: #424553;" for="">Show All</label>
                    </div>
                    <div class="other-cites2">
                            <div class="other-cites2_1">
                                <div>
                                    <p style="font-size: 20px;" id="temp-USA"></p>
                                    <p>USA</p>
                                </div>
                                <div>
                                    <span id="temp-max-min-USA"></span>
                                </div>
                                <div>
                                    <img id="icon-USA">
                                </div>
                            </div>
                            <div class="other-cites2_2">
                                <div>
                                    <p style="font-size: 20px;" id="temp-Dubai"></p>
                                    <p>Dubai</p>
                                </div>
                                <div>
                                    <span id="temp-max-min-Dubai"></span>
                                </div>
                                <div>
                                    <img id="icon-Dubai">
                                </div>
                            </div>
                            <div class="other-cites2_3">
                               <div>
                                    <p style="font-size: 20px;" id="temp-China"></p>
                                    <p>China</p>
                                </div>
                                <div>
                                    <span id="temp-max-min-China"></span>
                                </div>
                                <div>
                                    <img id="icon-China">
                                </div>
                            </div>
                            <div class="other-cites2_4">
                                <div>
                                    <p style="font-size: 20px;" id="temp-Canada"></p>
                                    <p>Canada</p>
                                </div>
                                <div>
                                    <span id="temp-max-min-Canada"></span>
                                </div>
                                <div>
                                    <img id="icon-Canada">
                                </div>
                            </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
